<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прости меня</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page" data-level="0">

  <div class="rain" aria-hidden="true"></div>
  <div class="lightning" aria-hidden="true"></div>

  <main class="card" role="main">

    <figure class="photo">
      <div class="photo-frame">
        <img class="photo-img" src="" alt="Грустный котик просит прощения">

        <p class="photo-empty">
          Фотки не нашлись.<br>
          Проверь папку <code>image</code> и пути в <code>script.js</code>.
        </p>

        <div class="tears" aria-hidden="true"></div>
      </div>
    </figure>

    <div class="content">
      <p class="word" role="status" aria-live="polite">ПРОСТИ</p>
      <p class="subword">я правда не хотел</p>

      <div class="counter" aria-live="polite">
        Отказов: <span class="counter-value">0</span>
      </div>

      <div class="actions">
        <button class="btn btn--yes" type="button">Прощаю</button>
        <button class="btn btn--no" type="button">Нет</button>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
